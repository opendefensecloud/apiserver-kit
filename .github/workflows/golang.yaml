name: Golang CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "**/*.go"
      - ".github/workflows/golang.yaml"
      - ".golangci.yml"
      - "Makefile"
      - "devenv.nix"
      - "go.mod"
      - "go.sum"
  # No paths filter on pull_request: lint and test are required checks, and a
  # workflow that never starts never reports them. The changes job filters
  # instead, and a skipped job counts as passed.
  pull_request:
    branches: [main, develop]

env:
  GO_MODULE: https://github.com/opendefensecloud/apiserver-kit

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - '.github/workflows/golang.yaml'
              - '.golangci.yml'
              - 'Makefile'
              - 'flake.lock'
              - 'flake.nix'
              - 'go.mod'
              - 'go.sum'
              - 'tools.lock'

  lint:
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    outputs:
      go-version: ${{ steps.go-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: go-version
        uses: opendefensecloud/dev-kit/.github/actions/get-go-version@6cd9f749d3b2769c8603d0bd77a3ebc23050dfa6 # v3.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
      - name: lint-license-and-shell
        run: |
          make lint-no-golangci
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          verify: false

  test:
    needs: lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.lint.outputs.go-version }}
      - name: test
        run: |
          make test
      - name: Convert coverage to lcov
        uses: jandelgado/gcov2lcov-action@e4612787670fc5b5f49026b8c29c5569921de1db # v1.2.0
        with:
          infile: sl.coverprofile
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: coverage.lcov
