name: Codegen Check
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: go-version
        uses: opendefensecloud/dev-kit/.github/actions/get-go-version@6cd9f749d3b2769c8603d0bd77a3ebc23050dfa6 # v3.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
      - name: Run codegen
        run: |
          cd example && make codegen
      - name: Check for changes
        uses: opendefensecloud/dev-kit/.github/actions/diff-check@6cd9f749d3b2769c8603d0bd77a3ebc23050dfa6 # v3.1.0
